# =========================================================
# UniShut Backend - Application Configuration
# =========================================================

# ---------------------------------------------------------
# Application
# ---------------------------------------------------------

spring.application.name=unishut-backend


# ---------------------------------------------------------
# Server
# ---------------------------------------------------------

server.port=8080

server.servlet.context-path=/api


# ---------------------------------------------------------
# Database
# ---------------------------------------------------------

spring.datasource.url=jdbc:mysql://localhost:3306/unishut?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

spring.datasource.username=root

spring.datasource.password=1234

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ---------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false



# ---------------------------------------------------------
# Jackson
# ---------------------------------------------------------

spring.jackson.serialization.write-dates-as-timestamps=false

spring.jackson.time-zone=UTC


# ---------------------------------------------------------
# JWT Authentication
# ---------------------------------------------------------

unishut.jwt.secret=V3ebOoVOyUfggLoeoUK7YgAD62SquOjHucV9tbVgUCI=

unishut.jwt.expiration=86400000


# ---------------------------------------------------------
# UniShut GPS TCP Server
# ---------------------------------------------------------

unishut.gps.tcp-host=0.0.0.0

unishut.gps.tcp-port=9090

unishut.gps.max-connections=50

unishut.gps.max-message-size=4096


# ---------------------------------------------------------
# Logging
# ---------------------------------------------------------

logging.level.root=INFO

logging.level.com.unishut=INFO

logging.level.com.unishut.threading=INFO

logging.level.org.springframework.web=INFO


# ---------------------------------------------------------
# Error Handling
# ---------------------------------------------------------

server.error.include-message=always

server.error.include-binding-errors=always


# ---------------------------------------------------------
# File Upload
# ---------------------------------------------------------

spring.servlet.multipart.max-file-size=10MB

spring.servlet.multipart.max-request-size=20MB